name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hivesat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check generated Worker types
        run: pnpm wrangler:types:check

      - name: Build
        run: pnpm build

      - name: Validate Cloudflare deployment
        run: pnpm wrangler:dry-run

  wasm-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache pinned solver sources and Emscripten SDK
        uses: actions/cache@v5
        with:
          path: .cache/solver
          key: solver-${{ runner.os }}-${{ hashFiles('solver/versions.env') }}

      - name: Rebuild and compare committed Wasm artifacts
        run: ./solver/check-reproducible.sh

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome
            browser: chrome
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: edge
            browser: msedge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser E2E tests
        run: pnpm test:e2e --project=${{ matrix.project }}
