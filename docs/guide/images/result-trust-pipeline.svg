<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">HiveSAT result trust pipeline</title>
  <desc id="desc">An anonymous browser proposes SAT or UNSAT. SAT flows through a model upload and independent verifier to SAT verified. UNSAT requires independent repetition and remains a candidate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11170f"/>
      <stop offset="1" stop-color="#202618"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a7b38c"/>
    </marker>
    <style>
      .box{fill:#1b2118;stroke:#94a76a;stroke-width:2}
      .sat{fill:#1f2d19;stroke:#b7e34a;stroke-width:3}
      .unsat{fill:#2d2618;stroke:#e8ad45;stroke-width:3}
      .title{fill:#f1f4e9;font:700 24px system-ui,sans-serif}
      .text{fill:#d6ddc7;font:17px system-ui,sans-serif}
      .small{fill:#aeb99b;font:15px system-ui,sans-serif}
      .line{fill:none;stroke:#a7b38c;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="title">Anonymous work becomes a verdict only through independent evidence</text>
  <rect class="box" x="55" y="245" width="230" height="145" rx="16"/>
  <text x="170" y="285" text-anchor="middle" class="title">Browser worker</text>
  <text x="170" y="320" text-anchor="middle" class="text">CaDiCaL solves one cube</text>
  <text x="170" y="350" text-anchor="middle" class="small">untrusted result source</text>
  <path class="line" d="M285 285 C340 285 345 155 405 155"/>
  <path class="line" d="M285 350 C340 350 345 505 405 505"/>
  <rect class="sat" x="405" y="90" width="275" height="155" rx="16"/>
  <text x="542" y="130" text-anchor="middle" class="title">SAT candidate</text>
  <text x="542" y="165" text-anchor="middle" class="text">compact model bitset</text>
  <text x="542" y="195" text-anchor="middle" class="small">formula + cube + path hashes</text>
  <text x="542" y="220" text-anchor="middle" class="small">lease-scoped R2 upload</text>
  <rect class="unsat" x="405" y="430" width="275" height="155" rx="16"/>
  <text x="542" y="470" text-anchor="middle" class="title">UNSAT report</text>
  <text x="542" y="505" text-anchor="middle" class="text">requeue exact same cube</text>
  <text x="542" y="535" text-anchor="middle" class="small">fresh independent session</text>
  <text x="542" y="560" text-anchor="middle" class="small">agreement is not a proof</text>
  <path class="line" d="M680 165 L770 165"/>
  <path class="line" d="M680 505 L770 505"/>
  <rect class="sat" x="770" y="90" width="365" height="155" rx="16"/>
  <text x="952" y="130" text-anchor="middle" class="title">ResultVerifierDO</text>
  <text x="952" y="165" text-anchor="middle" class="text">re-hash and decode both objects</text>
  <text x="952" y="195" text-anchor="middle" class="text">check cube and every clause</text>
  <text x="952" y="222" text-anchor="middle" class="small">only VALID_SAT → SAT_VERIFIED</text>
  <rect class="unsat" x="770" y="430" width="365" height="155" rx="16"/>
  <text x="952" y="470" text-anchor="middle" class="title">UNSAT_CANDIDATE</text>
  <text x="952" y="505" text-anchor="middle" class="text">two sessions + exact coverage</text>
  <text x="952" y="535" text-anchor="middle" class="text">still not a terminal verdict</text>
  <text x="952" y="562" text-anchor="middle" class="small">a checked proof is required later</text>
  <text x="600" y="628" text-anchor="middle" class="small">Malformed, missing, invalid, timed-out, or incomplete evidence always fails closed.</text>
</svg>
